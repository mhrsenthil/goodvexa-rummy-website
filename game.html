<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">GOODVEXA RUMMY - Practice</title>

<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --table-green: #0c573a;
  --felt-edge: #7d5726;
  --gold: #e8c45b;
  --surface: #0a241a;
}
html, body { width: 100%; min-height: 100%; }
body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: #04170f;
  color: #f8f7ef;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 54px;
  padding: 7px clamp(12px, 3vw, 28px);
  gap: 12px;
  border-bottom: 1px solid rgba(232,196,91,.68);
  background: #03120b;
}
.logo-title { color: #f4d477; font-size: clamp(15px, 2vw, 20px); font-weight: 800; letter-spacing: .04em; }
.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.header-actions .language-select { min-height: 40px; max-width: 110px; padding: 5px 7px; border: 1px solid rgba(232,196,91,.55); border-radius: 9px; background: #0c3826; color: #f8f7ef; font: inherit; font-size: 12px; }
.header-actions .language-select:not([data-ready="true"]) { visibility: hidden; }
.header-actions .language-select:focus-visible { outline: 3px solid #ffe38b; outline-offset: 2px; }
.user-badge { padding: 6px 12px; border: 1px solid rgba(232,196,91,.5); border-radius: 999px; background: #0c3826; color: #e2f0d9; font-size: 13px; }
.user-badge span { color: #ffcf36; font-weight: 700; }
.avatar-box { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 2px solid var(--gold); border-radius: 50%; background: #1b4332; box-shadow: 0 4px 8px rgba(0,0,0,.28); }
.game-container {
  position: static;
  min-height: 0;
  width: min(100%, 1500px);
  margin: 0 auto;
  padding: clamp(8px, 1.8vh, 18px) clamp(10px, 2.5vw, 32px);
  display: grid;
  grid-template-rows: auto minmax(190px, 1fr) auto;
  grid-template-areas: "opponent" "table" "player";
  align-items: stretch;
  justify-items: stretch;
  justify-content: stretch;
  gap: clamp(8px, 1.4vh, 16px);
  overflow: auto;
  overflow-x: hidden;
  background: radial-gradient(ellipse at center, #125c40 0%, #092e20 66%, #04170f 100%);
}
.game-container[data-mode="practice"] {
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "table" "player";
}
.game-container[data-mode="practice"] .opponent-area,
.opponent-area[hidden] { display: none !important; }
.opponent-area {
  position: static;
  grid-area: opponent;
  justify-self: center;
  flex-direction: row;
  gap: 10px;
  padding: 5px 14px;
  border: 1px solid rgba(232,196,91,.36);
  border-radius: 999px;
  background: rgba(3,18,11,.58);
}
.avatar-box { width: 36px; height: 36px; font-size: 18px; }
.rummy-table {
  position: relative;
  inset: auto;
  grid-area: table;
  transform: none;
  width: min(100%, 1040px);
  min-width: 0;
  height: auto;
  min-height: 190px;
  max-height: none;
  justify-self: center;
  align-self: stretch;
  border: clamp(6px, 1.1vw, 12px) solid var(--felt-edge);
  border-radius: clamp(70px, 15vw, 190px);
  box-shadow: inset 0 0 44px rgba(0,0,0,.46), 0 12px 26px rgba(0,0,0,.28);
  background: radial-gradient(ellipse at center, #15734b 0%, var(--table-green) 68%, #073823 100%);
}
.table-center { gap: clamp(34px, 9vw, 100px); }
.table-center { display: flex; align-items: center; justify-content: center; }
.deck-box, .discard-box { display: flex; min-width: 100px; flex-direction: column; align-items: center; gap: 8px; }
.deck-title { color: #ffe38b; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
.card {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: space-between;
  flex: 0 0 48px;
  width: 48px;
  height: 70px;
  margin-left: 0;
  padding: 5px;
  border: 1px solid #d6d6d6;
  border-radius: 7px;
  background: #fff;
  color: #171717;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 3px 9px rgba(0,0,0,.28);
  transition: transform .16s ease, box-shadow .16s ease;
}
.card.red { color: #c51f32; }
.card-face { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 1px; max-width: 100%; }
.card-rank { font-size: clamp(19px, 2vw, 25px); font-weight: 900; -webkit-text-stroke: .2px currentColor; line-height: .95; letter-spacing: -.045em; }
.card-suit { font-size: clamp(20px, 2.1vw, 26px); font-weight: 900; -webkit-text-stroke: .2px currentColor; line-height: .9; }
.card.joker-card .card-rank { font-size: clamp(15px, 1.55vw, 20px); letter-spacing: 0; }
.card-back { border: 2px solid #fff; background: repeating-linear-gradient(135deg, #9b2424 0 7px, #721818 7px 14px); }
.card.selected { transform: translateY(-8px); }
.card.grouped-card {
  opacity: 1;
  border-color: #bac7bd;
  background: #fff;
  outline: 2px solid rgba(83,215,138,.48);
  outline-offset: -2px;
}
.card-back { appearance: none; }
.player-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: auto;
  grid-area: player;
  width: min(100%, 1120px);
  max-width: none;
  min-width: 0;
  justify-self: center;
  gap: 9px;
  padding: 10px clamp(10px, 1.8vw, 22px) 12px;
  border: 1px solid rgba(232,196,91,.48);
  border-radius: 16px;
  background: linear-gradient(145deg, rgba(5,26,17,.96), rgba(11,48,32,.97));
  box-shadow: 0 8px 24px rgba(0,0,0,.24);
}
.practice-groups {
  display: flex;
  flex-flow: row nowrap;
  align-items: start;
  justify-content: safe center;
  width: 100%;
  min-width: 0;
  gap: clamp(8px, 1.2vw, 16px);
  overflow-x: auto;
  overflow-y: hidden;
  padding: 10px 1px 5px;
  overscroll-behavior-inline: contain;
  scrollbar-width: thin;
  scrollbar-color: #8e713a rgba(0,0,0,.15);
}
#hand[hidden] { display: none !important; }
.practice-group { flex: 0 0 auto; width: max-content; min-width: max-content; border-radius: 7px 7px 5px 5px; background: rgba(0,0,0,.12); }
.practice-group-cards { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: flex-start; gap: clamp(2px, .35vw, 5px); }
.practice-group-cards .card { flex: 0 0 clamp(48px, 4vw, 56px); width: clamp(48px, 4vw, 56px); height: clamp(68px, 7vh, 78px); cursor: pointer; }
.practice-group-label { display: block; width: 100%; min-height: 21px; padding: 4px 7px; border: 0; border-radius: 0 0 5px 5px; color: #fff; font-family: inherit; font-size: 10px; font-weight: 800; line-height: 1.2; letter-spacing: .035em; text-align: center; white-space: nowrap; cursor: pointer; }
.practice-group.pure .practice-group-label { background: #258447; }
.practice-group.impure .practice-group-label { background: #167a91; }
.practice-group.set .practice-group-label { background: #7150a4; }
.practice-group.unmatched .practice-group-label { background: #a74343; }
.card[role="button"]:focus-visible, button:focus-visible { outline: 3px solid #fff1a8; outline-offset: 2px; }
.action-bar {
  width: max-content;
  max-width: 100%;
  margin-inline: auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  justify-self: center;
  gap: 8px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 44px;
  border: 1px solid rgba(255,255,255,.12);
  padding: 9px clamp(7px, 1.2vw, 16px);
  background: linear-gradient(180deg, #fce07e 0%, #d49c24 100%);
  color: #111;
  border-radius: 9px;
  font-size: clamp(11px, 1.1vw, 13px);
  font-weight: 700;
  line-height: 1.2;
  font-family: inherit;
  white-space: normal;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,.22);
}
.btn:disabled { opacity: .48; cursor: not-allowed; }
.btn-declare { color: #fff; background: linear-gradient(180deg, #2bf076 0%, #119443 100%); }
.btn-exit { color: #fff; background: linear-gradient(180deg, #ff7070 0%, #bd3434 100%); }
.status-msg {
  position: static;
  align-self: stretch;
  max-width: 100%;
  padding: 7px 12px;
  border-radius: 9px;
  text-align: center;
  line-height: 1.35;
  overflow-wrap: anywhere;
}
.orientation-note { display: none; text-align: center; font-size: 12px; color: #ffe38b; }
.declaration-result { align-self: stretch; max-height: 24vh; overflow: auto; line-height: 1.5; }
.declaration-result:empty { display: none; }
.declaration-result div { padding-top: 3px; }
.groups-empty { grid-column: 1 / -1; padding: 10px; color: #bfcec4; text-align: center; }

@media (max-width: 700px) {
  header { min-height: 48px; padding: 5px 10px; }
  .user-badge { padding: 5px 9px; font-size: 12px; }
  .fullscreen-btn { min-height: 40px; padding: 6px 9px; font-size: 11px; }
  .header-actions { gap: 5px; }
  .header-actions .language-select { max-width: 88px; min-height: 38px; padding: 4px; font-size: 11px; }
  .game-container {
    grid-template-rows: auto minmax(135px, 1fr) auto;
    gap: 7px;
    padding: 7px 9px;
  }
  .opponent-area { padding: 3px 10px; }
  .rummy-table { width: 100%; min-height: 135px; border-radius: 80px; }
  .table-center { gap: clamp(22px, 8vw, 58px); }
  .deck-box, .discard-box { min-width: 76px; }
  .deck-title { font-size: 10px; }
  .player-area { width: 100%; gap: 6px; padding: 7px; border-radius: 13px; }
  .practice-groups { gap: 8px; }
  .practice-group-cards { gap: 2px; }
  .practice-group-cards .card { flex-basis: clamp(29px, 9vw, 40px); width: clamp(29px, 9vw, 40px); height: 54px; padding: 4px 3px; font-size: 12px; }
  .practice-group-cards .card-rank { font-size: clamp(15px, 2.5vw, 20px); }
  .practice-group-cards .card-suit { font-size: clamp(17px, 2.9vw, 23px); }
  .practice-group-cards .card.joker-card .card-rank { font-size: clamp(13px, 2.1vw, 16px); }
  .practice-group-label { min-height: 20px; font-size: 9px; }
  .action-bar { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .action-bar .btn { min-height: 43px; padding: 7px 5px; font-size: 11px; }
  .status-msg { font-size: 12px; }
}
@media (max-width: 700px) and (orientation: portrait) {
  body { height: auto; min-height: 100dvh; overflow: auto; }
  .game-container { min-height: calc(100dvh - 48px); grid-template-rows: auto minmax(150px, 24dvh) auto; overflow: visible; }
  .orientation-note { display: block; }
  .player-area { padding: 9px; }
  .practice-group-cards .card { flex-basis: clamp(36px, 11vw, 48px); width: clamp(36px, 11vw, 48px); height: 62px; }
}
@media (orientation: landscape) and (max-height: 600px) {
  header { min-height: 44px; padding: 3px 10px; }
  .game-container {
    grid-template-rows: auto minmax(96px, 1fr) auto;
    gap: 3px;
    padding: 3px clamp(8px, 1.5vw, 14px);
    overflow: hidden;
  }
  .game-container[data-mode="practice"] { grid-template-rows: minmax(96px, 1fr) auto; }
  .opponent-area { display: flex; align-items: center; min-height: 24px; gap: 5px; padding: 1px 7px; }
  .avatar-box { width: 22px; height: 22px; font-size: 13px; }
  .rummy-table { min-height: 96px; border-radius: 48px; }
  .table-center { gap: clamp(12px, 5vw, 42px); }
  .deck-box, .discard-box { width: clamp(76px, 12vw, 104px); min-width: 0; gap: 2px; }
  .deck-title { font-size: 9px; letter-spacing: .04em; }
  .deck-box .card, #discardTop .card { width: 43px; height: 44px; min-height: 0; padding: 3px; font-size: 11px; }
  #discardTop .card-rank { font-size: 15px; }
  #discardTop .card-suit { font-size: 17px; }
  #deckCount { font-size: 10px !important; line-height: 1; }
  #pileBtn { min-height: 28px; padding: 3px 8px !important; font-size: 10px !important; }
  .player-area { min-height: 0; gap: 2px; padding: 3px 8px; }
  .practice-groups { gap: 7px; padding-bottom: 3px; }
  .practice-group-cards { gap: 2px; }
  .practice-group-cards .card { flex-basis: clamp(32px, 5.5vw, 40px); width: clamp(32px, 5.5vw, 40px); height: 48px; padding: 3px; border-radius: 4px; font-size: 10px; }
  .practice-group-cards .card-rank { font-size: clamp(14px, 2.2vw, 18px); }
  .practice-group-cards .card-suit { font-size: clamp(16px, 2.5vw, 20px); }
  .practice-group-cards .card.joker-card .card-rank { font-size: 12px; }
  .practice-group-label { min-height: 17px; padding: 3px 5px; font-size: 8px; }
  .card.selected { transform: translateY(-4px); }
  .status-msg { max-height: 18px; min-height: 0; padding: 1px 5px; font-size: 9px; line-height: 1.1; overflow: hidden; }
  .status-msg:empty { display: none; }
  .action-bar { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .action-bar .btn { min-height: 34px; padding: 3px 2px; font-size: 9px; }
}
@media (min-width: 701px) and (min-height: 750px) {
  .game-container { grid-template-rows: auto minmax(250px, 1fr) auto; }
  .player-area { padding: 14px 22px 16px; gap: 11px; }
}
</style>
</head>

<body>

<header>
  <div class="logo-title" id="modeHeaderTitle">♠ GOODVEXA RUMMY ♥</div>
  <div class="header-actions">
    <div class="user-badge">👤 <span id="playerName">Guest</span></div>
    <select class="language-select" data-language-selector aria-label="Language">
      <option value="ta">தமிழ்</option><option value="en">English</option><option value="hi">हिंदी</option><option value="te">తెలుగు</option><option value="ml">മലയാളം</option><option value="kn">ಕನ್ನಡ</option><option value="mr">मराठी</option><option value="bn">বাংলা</option><option value="gu">ગુજરાતી</option><option value="pa">ਪੰਜਾਬੀ</option>
    </select>
    <button class="btn fullscreen-btn" type="button" onclick="toggleFullscreen()" aria-label="Enter fullscreen">⛶ Fullscreen</button>
  </div>
</header>

<main class="game-container" id="gameContainer">

  <!-- Opponent seat marker -->
  <section class="opponent-area" id="opponentArea" aria-label="Opponent area">
    <div class="avatar-box" aria-hidden="true">🃏</div>
  </section>

  <!-- CENTER RUMMY TABLE -->
  <section class="rummy-table" id="tableArea" aria-label="Rummy table">
    <div class="table-center">
      
      <!-- CLOSED DECK -->
      <div class="deck-box">
        <span class="deck-title">CLOSED DECK</span>
        <button type="button" class="card card-back" onclick="drawFromDeck()" id="drawBtn" aria-label="Draw from closed deck"></button>
        <small id="deckCount" style="color:#d8eadf; font-size:11px;">0 Left</small>
      </div>

      <!-- DISCARD PILE -->
      <div class="discard-box">
        <span class="deck-title">OPEN PILE</span>
        <div id="discardTop">
          <div class="card" style="opacity:0.3;">Empty</div>
        </div>
        <button class="btn" style="padding:4px 8px; font-size:10px;" onclick="drawFromDiscard()" id="pileBtn" disabled>TAKE</button>
      </div>

    </div>
  </section>

  <!-- BOTTOM PLAYER INTERFACE -->
  <section class="player-area" id="playerArea" aria-label="Your hand and game controls">
    
    <div class="practice-groups" id="hand" aria-label="Your card groups" hidden></div>
    <div class="status-msg" id="message" role="status" aria-live="polite">விளையாட்டு முறை ஏற்றப்படுகிறது...</div>
    <p class="orientation-note">Landscape works best. Rotate your device, or continue in portrait.</p>

    <!-- GAME CONTROL BUTTONS -->
    <div class="action-bar">
      <button class="btn" onclick="startGame()">START GAME</button>
      <button class="btn" onclick="discardSelected()" id="discardBtn" disabled>DISCARD</button>
      <button class="btn btn-declare" onclick="declareRummy()">DECLARE</button>
      <button class="btn btn-exit" onclick="window.location.href='index.html'">EXIT</button>
    </div>
    <div class="declaration-result" id="declarationResult" aria-live="polite"></div>

  </section>
</main>

<script src="assets/language.js"></script>
<script src="assets/rummy-rules.js"></script>
<script>
"use strict";

let deck = [];
let hand = [];
let discardPile = [];
let selected = [];
let groups = [];
let groupTypes = [];
let mustDiscard = false;
let gameStarted = false;
let currentMode = "practice";

window.onload = function() {
    const savedUser = localStorage.getItem('rummy_user');
    if (savedUser) {
      try {
        const parsedUser = JSON.parse(savedUser);
        const nameOnly = (parsedUser && parsedUser.username) || savedUser;
        const publicName = typeof nameOnly === "string" && !nameOnly.includes("@") ? nameOnly : "Guest";
        document.getElementById('playerName').textContent = publicName;
        if ((parsedUser && typeof parsedUser === "object") || publicName !== nameOnly) localStorage.setItem('rummy_user', publicName);
      } catch (_) {
        document.getElementById('playerName').textContent = savedUser.includes("@") ? "Guest" : savedUser;
      }
    }
    // Legacy client-only fields are not needed for authentication or public identity.
    localStorage.removeItem('rummy_email');
    localStorage.removeItem('rummy_wallet');

    // URL Parameter-ஐ சரிபார்த்து Game Mode-ஐ தீர்மானித்தல்
    const urlParams = new URLSearchParams(window.location.search);
    currentMode = urlParams.get('mode') || 'practice';

    applyGameModeLayout(currentMode);
    render();
};

function applyGameModeLayout(mode) {
    const titleEl = document.getElementById("modeHeaderTitle");
    const msgEl = document.getElementById("message");
    const gameContainer = document.getElementById("gameContainer");
    const opponentArea = document.getElementById("opponentArea");
    gameContainer.dataset.mode = mode;
    opponentArea.hidden = mode === "practice";

    document.querySelector('.action-bar button[onclick="startGame()"]').disabled = false;
    switch(mode) {
        case 'practice':
            titleEl.textContent = "GOODVEXA RUMMY - Solo Practice";
            msgEl.textContent = "";
            break;
        case 'multiplayer':
            titleEl.textContent = "GOODVEXA RUMMY - Multiplayer";
            msgEl.textContent = "Multiplayer is not implemented. Choose Practice for solo play.";
            document.querySelector('.action-bar button[onclick="startGame()"]').disabled = true;
            break;
        case 'tournament':
            titleEl.textContent = "GOODVEXA RUMMY - Tournaments";
            msgEl.textContent = "Tournaments are not implemented. Choose Practice for solo play.";
            document.querySelector('.action-bar button[onclick="startGame()"]').disabled = true;
            break;
        default:
            titleEl.textContent = "GOODVEXA RUMMY - Solo Practice";
            msgEl.textContent = "";
            break;
    }
}

function rankText(card) {
  if (card.joker) return "JK";
  if (card.rank === 1) return "A";
  if (card.rank === 11) return "J";
  if (card.rank === 12) return "Q";
  if (card.rank === 13) return "K";
  return String(card.rank);
}

function cardHTML(card, index, selectable) {
  const color = card.red ? "red" : "";
  const chosen = selectable && selected.includes(index);
  const grouped = selectable && groups.some(group => group.includes(card));
  const label = card.joker ? "JK" : rankText(card);
  const accessibleLabel = card.joker ? "JOKER" : label;

  return `
    <div class="card ${color} ${card.joker ? "joker-card" : ""} ${chosen ? "selected" : ""} ${grouped ? "grouped-card" : ""}" ${selectable ? `onclick="selectCard(${index}, event)" draggable="true" ondragstart="startCardDrag(${index}, event)" ondragend="endCardDrag(event)" ontouchstart="startTouchDrag(${index}, event)"` : ""} role="${selectable ? "button" : "img"}" aria-label="${accessibleLabel} ${card.suit}${grouped ? ', grouped' : ''}">
      <span class="card-face"><strong class="card-rank">${label}</strong><span class="card-suit">${card.suit}</span></span>
    </div>
  `;
}

function startGame() {
  if (currentMode === "multiplayer" || currentMode === "tournament") return;
  deck = RummyEngine.createDeck();
  hand = [];
  discardPile = [];
  selected = [];
  groups = [];
  groupTypes = [];
  mustDiscard = false;
  gameStarted = true;
  document.getElementById("declarationResult").textContent = "";

  for (let i = 0; i < 13; i++) hand.push(deck.pop());
  sortHand();
  initializeGroups();
  discardPile.push(deck.pop());

  showMessage("Game started. Draw a card, then discard one card to finish your turn.");
  render();
}

function render() {
  const handElement = document.getElementById("hand");
  if (currentMode === "practice") handElement.hidden = !gameStarted || hand.length === 0;
  ensureFourGroups();
  handElement.innerHTML = groups.map((group, index) => {
    const validation = RummyEngine.validateGroup(group);
    const type = validation.valid ? validation.type : "Unmatched cards";
    const key = type === "Pure Sequence" ? "pure" : type === "Impure Sequence" ? "impure" : type === "Set" ? "set" : "unmatched";
    const label = type === "Unmatched cards" ? "UNMATCHED" : type.toUpperCase();
    const cards = group.map(card => cardHTML(card, hand.indexOf(card), true)).join("");
    return `<section class="practice-group ${key}" data-group-index="${index}" aria-label="${label}" role="group" ondragover="allowGroupDrop(event)" ondrop="dropCardsIntoGroup(${index}, event)">
      <div class="practice-group-cards">${cards}</div>
      <button type="button" class="practice-group-label" data-group-index="${index}" onclick="moveSelectedToGroup(${index}, event)" aria-label="Move selected cards to ${label.toLowerCase()}">${label}</button>
    </section>`;
  }).join("");
  document.getElementById("deckCount").textContent = String(deck.length);
  document.getElementById("drawBtn").disabled = !gameStarted || mustDiscard || deck.length === 0;

  const top = discardPile[discardPile.length - 1];
  document.getElementById("discardTop").innerHTML = top ? cardHTML(top, -1, false) : '<div class="card" style="opacity:0.3;">Empty</div>';

  document.getElementById("pileBtn").disabled = !gameStarted || mustDiscard || discardPile.length === 0;
  document.getElementById("discardBtn").disabled = !gameStarted || !mustDiscard || selected.length !== 1;

}

function ensureFourGroups() {
  while (groups.length < 4) groups.push([]);
  if (groups.length > 4) {
    groups[3].push(...groups.splice(4).flat());
  }
  for (let index = 0; index < 4; index++) {
    if (!Array.isArray(groups[index])) groups[index] = [];
  }
  groupTypes = groups.map(group => {
    const result = RummyEngine.validateGroup(group);
    return result.valid ? result.type : "Unmatched cards";
  });
}

function sortGroupCards(group) {
  const suitOrder = { "♠": 1, "♥": 2, "♦": 3, "♣": 4 };
  group.sort((first, second) => {
    if (first.joker && second.joker) return String(first.id).localeCompare(String(second.id));
    if (first.joker) return 1;
    if (second.joker) return -1;
    return (first.rank - second.rank) || (suitOrder[first.suit] - suitOrder[second.suit]);
  });
}

function initializeGroups() {
  groups = [hand.slice(0, 3), hand.slice(3, 6), hand.slice(6, 9), hand.slice(9, 13)];
  groups.forEach(sortGroupCards);
  ensureFourGroups();
}

function analyzeHand() {
  ensureFourGroups();
}

function moveSelectedToGroup(destination, event) {
  if (event && typeof event.stopPropagation === "function") event.stopPropagation();
  destination = Number(event && event.currentTarget && event.currentTarget.dataset
    ? event.currentTarget.dataset.groupIndex
    : destination);
  if (!gameStarted || !Number.isInteger(destination) || destination < 0 || destination >= 4 || selected.length === 0) return;
  moveCardsToGroup(selected, destination);
}

function moveCardsToGroup(cardIndexes, destination) {
  if (!gameStarted || !Number.isInteger(destination) || destination < 0 || destination >= 4) return;
  ensureFourGroups();
  const moving = [...new Set(cardIndexes.map(index => hand[index]).filter(Boolean))]
    .sort((first, second) => hand.indexOf(first) - hand.indexOf(second));
  if (!moving.length) return;
  const affectedGroups = new Set([destination]);
  moving.forEach(card => {
    groups.forEach((group, source) => {
      if (source !== destination) {
        const cardIndex = group.indexOf(card);
        if (cardIndex !== -1) {
          group.splice(cardIndex, 1);
          affectedGroups.add(source);
        }
      }
    });
    if (!groups[destination].includes(card)) groups[destination].push(card);
  });
  affectedGroups.forEach(index => sortGroupCards(groups[index]));
  selected = [];
  analyzeHand();
  render();
}

function startCardDrag(index, event) {
  if (!event.dataTransfer) return;
  event.dataTransfer.setData("text/plain", String(index));
  event.dataTransfer.effectAllowed = "move";
  if (event.currentTarget.classList) event.currentTarget.classList.add("dragging-card");
}

function endCardDrag(event) {
  if (event.currentTarget && event.currentTarget.classList) event.currentTarget.classList.remove("dragging-card");
}

function allowGroupDrop(event) {
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
}

function dropCardsIntoGroup(destination, event) {
  event.preventDefault();
  event.stopPropagation();
  if (!event.dataTransfer) return;
  const draggedIndex = Number(event.dataTransfer.getData("text/plain"));
  if (!Number.isInteger(draggedIndex) || !hand[draggedIndex]) return;
  const cardIndexes = selected.includes(draggedIndex) ? selected : [draggedIndex];
  moveCardsToGroup(cardIndexes, destination);
}

let activeTouchDrag = null;
function startTouchDrag(index, event) {
  if (!event.touches || event.touches.length !== 1) return;
  const touch = event.touches[0];
  activeTouchDrag = { index, startX: touch.clientX, startY: touch.clientY, dragging: false, target: -1 };
  document.addEventListener("touchmove", updateTouchDrag, { passive: false });
  document.addEventListener("touchend", finishTouchDrag, { once: true });
  document.addEventListener("touchcancel", cancelTouchDrag, { once: true });
}

function updateTouchDrag(event) {
  if (!activeTouchDrag || !event.touches || !event.touches.length) return;
  const touch = event.touches[0];
  const dx = touch.clientX - activeTouchDrag.startX;
  const dy = touch.clientY - activeTouchDrag.startY;
  if (!activeTouchDrag.dragging && Math.hypot(dx, dy) > 8) activeTouchDrag.dragging = true;
  if (!activeTouchDrag.dragging) return;
  event.preventDefault();
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  const group = target && target.closest("[data-group-index]");
  activeTouchDrag.target = group ? Number(group.dataset.groupIndex) : -1;
}

function finishTouchDrag(event) {
  const drag = activeTouchDrag;
  activeTouchDrag = null;
  document.removeEventListener("touchmove", updateTouchDrag);
  document.removeEventListener("touchcancel", cancelTouchDrag);
  if (!drag || !drag.dragging) return;
  const touch = event.changedTouches && event.changedTouches[0];
  const target = touch && document.elementFromPoint(touch.clientX, touch.clientY);
  const group = target && target.closest("[data-group-index]");
  const destination = group ? Number(group.dataset.groupIndex) : drag.target;
  const cardIndexes = selected.includes(drag.index) ? selected : [drag.index];
  moveCardsToGroup(cardIndexes, destination);
}

function cancelTouchDrag() {
  activeTouchDrag = null;
  document.removeEventListener("touchmove", updateTouchDrag);
}

function selectCard(index, event) {
  if (event && typeof event.stopPropagation === "function") event.stopPropagation();
  if (!gameStarted) return;
  if (selected.includes(index)) {
    selected = selected.filter(i => i !== index);
  } else {
    selected.push(index);
  }
  render();
}

function clearSelection() {
  selected = [];
  render();
}

function drawFromDeck() {
  if (!gameStarted || mustDiscard || deck.length === 0) return;
  const card = deck.pop();
  hand.push(card);
  ensureFourGroups();
  groups[3].push(card);
  sortGroupCards(groups[3]);
  mustDiscard = true;
  selected = [];
  document.getElementById("declarationResult").textContent = "";
  render();
  showMessage("கார்டு எடுத்தாச்சு! ஒரு தேவையற்ற கார்டை வெளியேற்றவும் (DISCARD).");
}

function drawFromDiscard() {
  if (!gameStarted || mustDiscard || discardPile.length === 0) return;
  const card = discardPile.pop();
  hand.push(card);
  ensureFourGroups();
  groups[3].push(card);
  sortGroupCards(groups[3]);
  mustDiscard = true;
  selected = [];
  document.getElementById("declarationResult").textContent = "";
  render();
  showMessage("Open Pile-ல் இருந்து கார்டு எடுத்தாச்சு! ஒரு கார்டை வெளியேற்றவும்.");
}

function discardSelected() {
  if (!mustDiscard || selected.length !== 1) return;
  const card = hand[selected[0]];
  groups.forEach(group => {
    const groupIndex = group.indexOf(card);
    if (groupIndex !== -1) group.splice(groupIndex, 1);
  });
  groups.forEach(sortGroupCards);
  hand.splice(selected[0], 1);
  discardPile.push(card);
  selected = [];
  mustDiscard = false;
  analyzeHand();
  document.getElementById("declarationResult").textContent = "";
  render();
  showMessage("Card discarded. Draw a card for your next turn.");
}

function sortHand() {
  if (!gameStarted) return;
  const suitOrder = { "♠": 1, "♥": 2, "♦": 3, "♣": 4 };
  hand.sort((a, b) => {
    if (a.joker) return 1;
    if (b.joker) return -1;
    return (suitOrder[a.suit] - suitOrder[b.suit]) || (a.rank - b.rank);
  });
  selected = [];
  render();
  showMessage("அட்டைகள் வரிசைப்படுத்தப்பட்டன (Sorted).");
}

// ஒரு Group செல்லுபடியாகும் Sequence அல்லது Set ஆக உள்ளதா?
// GROUP CREATE
function createGroup() {
  if (!gameStarted || selected.length === 0) {
    showMessage("Move one or more selected cards into a group.");
    return;
  }
  if (mustDiscard) {
    showMessage("Discard a card to finish your turn before moving groups.");
    return;
  }
  moveSelectedToGroup(3);
  document.getElementById("declarationResult").textContent = "";
}

// REMOVE GROUP
function removeGroup(index) {
  if (!groups[index] || index === 3) return;
  groups[3].push(...groups[index]);
  sortGroupCards(groups[3]);
  groups[index] = [];
  selected = [];
  document.getElementById("declarationResult").textContent = "";
  analyzeHand();
  render();
}

// DECLARE
function declareRummy() {

  if (!gameStarted) {
    showMessage("முதலில் START GAME அழுத்தவும்.");
    return;
  }

  if (mustDiscard || hand.length !== 13) {
    showMessage("உங்கள் திருப்பத்தை முடித்து 13 கார்டுகளுடன் Declare செய்யவும்.");
    return;
  }

  const result = RummyEngine.validateDeclaredGroups(groups, hand);
  const resultBox = document.getElementById("declarationResult");

  if (!result.valid) {
    resultBox.textContent = `Invalid declaration: ${result.message}`;
    showMessage(result.message);
    return;
  }

  resultBox.innerHTML = `<strong>${result.message}</strong>${result.groups.map((group, index) => `<div>Group ${index + 1} · ${group.type}: ${group.cards.map(card => card.joker ? "Joker" : `${rankText(card)}${card.suit}`).join(" · ")}</div>`).join("")}`;
  showMessage("Valid declaration. Well played!");

  gameStarted = false;
  render();
}

function showMessage(msg) {
  document.getElementById("message").textContent = msg;
}

async function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock("landscape"); } catch (_) { /* Use the responsive portrait layout when locking is unavailable. */ }
      }
    } else {
      await document.exitFullscreen();
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }
  } catch (_) {
    showMessage("Fullscreen is unavailable in this browser. The responsive layout remains available.");
  }
}

render();
</script>
