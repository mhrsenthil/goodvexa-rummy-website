<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title id="pageTitle">♠ GOODVEXA RUMMY ♥ - Casino Table</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  background: #051a10;
  color: white;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER BAR */
header {
  padding: 10px 20px;
  background: #03120b;
  border-bottom: 2px solid #d6ad45;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 10;
}

.logo-title {
  color: #f4d477;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 1px;
}

.user-badge {
  background: #0c3826;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid #d6ad45;
  font-size: 14px;
  color: #e2f0d9;
}

.user-badge span {
  color: #ffcf36;
  font-weight: bold;
}

/* MAIN GAME LAYOUT */
.game-container {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
  background: radial-gradient(circle, #0e5c3e 0%, #052618 80%, #02120a 100%);
}

/* OVAL RUMMY TABLE */
.rummy-table {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -55%);
  width: 90%;
  max-width: 850px;
  height: 60vh;
  max-height: 420px;
  background: radial-gradient(ellipse at center, #116847 0%, #0c4d34 70%, #073523 100%);
  border: 12px solid #5a3d1b;
  border-radius: 200px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.7);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* TOP AI OPPONENT */
.opponent-area {
  position: absolute;
  top: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.avatar-box {
  width: 50px;
  height: 50px;
  background: #1b4332;
  border: 2px solid #ffcf36;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.5);
}

.bot-status {
  background: rgba(0,0,0,0.6);
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 12px;
  color: #f4d477;
}

/* CENTER CARDS AREA (DECK & DISCARD) */
.table-center {
  display: flex;
  gap: 30px;
  align-items: center;
}

.deck-box, .discard-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.deck-title {
  font-size: 12px;
  color: #ffe38b;
  font-weight: bold;
}

/* BOTTOM PLAYER AREA */
.player-area {
  width: 100%;
  max-width: 900px;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

/* ACTION BUTTONS */
.action-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  background: linear-gradient(180deg, #fce07e 0%, #d49c24 100%);
  color: #111;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 0 3px 6px rgba(0,0,0,0.4);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-declare {
  background: linear-gradient(180deg, #2bf076 0%, #119443 100%);
  color: white;
}

.btn-exit {
  background: linear-gradient(180deg, #ff5e62 0%, #c0392b 100%);
  color: white;
}

/* CARDS HAND CONTAINER */
.cards-hand {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: -15px;
  width: 100%;
  min-height: 85px;
  padding: 5px;
}

/* CARD ITEM DESIGN */
.card {
  width: 50px;
  height: 75px;
  background: white;
  color: #111;
  border-radius: 6px;
  border: 1px solid #ccc;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 4px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: -2px 2px 6px rgba(0,0,0,0.5);
  transition: transform 0.2s;
  margin-left: -12px;
}

.card:first-child {
  margin-left: 0;
}

.card.red {
  color: #d21f30;
}

.card.selected {
  transform: translateY(-15px);
  border: 2px solid #ffcf36;
  box-shadow: 0 0 10px #ffcf36;
}

.card-back {
  background: linear-gradient(135deg, #a81c1c 0%, #5c0808 100%);
  border: 2px solid #fff;
}

/* NOTIFICATION BAR */
.status-msg {
  position: absolute;
  bottom: 125px;
  background: rgba(0,0,0,0.75);
  padding: 6px 18px;
  border-radius: 20px;
  border: 1px solid #d6ad45;
  color: #ffe38b;
  font-size: 13px;
}

/* GROUPS DISPLAY */
.groups-container {
  display: flex;
  gap: 10px;
  max-width: 100%;
  overflow-x: auto;
}

.group-pill {
  background: rgba(0,0,0,0.5);
  border: 1px solid #d6ad45;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

@media(max-width: 600px) {
  .rummy-table {
    width: 96%;
    height: 52vh;
  }
  .card {
    width: 42px;
    height: 64px;
    font-size: 13px;
    margin-left: -15px;
  }
  .status-msg {
    bottom: 140px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo-title" id="modeHeaderTitle">♠ GOODVEXA RUMMY ♥</div>
  <div class="user-badge">
    👤 <span id="playerName">Guest</span> | 💰 <span id="playerWallet">1,00,000</span>
  </div>
</header>

<div class="game-container">

  <!-- TOP AI OPPONENT AREA -->
  <div class="opponent-area" id="opponentArea">
    <div class="avatar-box">🤖</div>
    <div class="bot-status" id="botStatus">AI Bot (Waiting...)</div>
  </div>

  <!-- CENTER OVAL CASINO TABLE -->
  <div class="rummy-table" id="tableArea">
    <div class="table-center">
      
      <!-- CLOSED DECK -->
      <div class="deck-box">
        <span class="deck-title">CLOSED DECK</span>
        <div class="card card-back" onclick="drawFromDeck()" id="deckBtn"></div>
        <small id="deckCount" style="color:#d8eadf; font-size:11px;">0 Left</small>
      </div>

      <!-- DISCARD PILE -->
      <div class="discard-box">
        <span class="deck-title">OPEN PILE</span>
        <div id="discardTop">
          <div class="card" style="opacity:0.3;">Empty</div>
        </div>
        <button class="btn" style="padding:4px 8px; font-size:10px;" onclick="drawFromDiscard()" id="pileBtn" disabled>TAKE</button>
      </div>

    </div>
  </div>

  <!-- FLOATING NOTIFICATION -->
  <div class="status-msg" id="message">விளையாட்டு முறை ஏற்றப்படுகிறது...</div>

  <!-- BOTTOM PLAYER INTERFACE -->
  <div class="player-area" id="playerArea">
    
    <!-- CREATED GROUPS DISPLAY -->
    <div class="groups-container" id="groupsDisplay"></div>

    <!-- CARDS HAND -->
    <div class="cards-hand" id="hand"></div>

    <!-- GAME CONTROL BUTTONS -->
    <div class="action-bar">
      <button class="btn" onclick="startGame()">START GAME</button>
      <button class="btn" onclick="sortHand()">SORT</button>
      <button class="btn" onclick="createGroup()">GROUP</button>
      <button class="btn" onclick="discardSelected()" id="discardBtn" disabled>DISCARD</button>
      <button class="btn btn-declare" onclick="declareRummy()">DECLARE</button>
      <button class="btn btn-exit" onclick="window.location.href='index.html'">EXIT</button>
    </div>

  </div>

</div>

<script>
"use strict";

let deck = [];
let hand = [];
let discardPile = [];
let selected = [];
let groups = [];
let mustDiscard = false;
let gameStarted = false;
let currentMode = "classic";

window.onload = function() {
    const savedUser = localStorage.getItem('rummy_user');
    const savedWallet = localStorage.getItem('rummy_wallet');

    if (savedUser) document.getElementById('playerName').textContent = savedUser;
    if (savedWallet) document.getElementById('playerWallet').textContent = Number(savedWallet).toLocaleString('en-IN');

    // URL Parameter-ஐ சரிபார்த்து Game Mode-ஐ தீர்மானித்தல்
    const urlParams = new URLSearchParams(window.location.search);
    currentMode = urlParams.get('mode') || 'classic';

    applyGameModeLayout(currentMode);
};

function applyGameModeLayout(mode) {
    const titleEl = document.getElementById("modeHeaderTitle");
    const msgEl = document.getElementById("message");

    switch(mode) {
        case 'practice':
            titleEl.textContent = "GOODVEXA RUMMY - Practice Mode (AI)";
            msgEl.textContent = "Practice Mode: AI எதிராளியுடன் பயிற்சி செய்யுங்கள். START GAME அழுத்தவும்.";
            break;
        case 'multiplayer':
            titleEl.textContent = "GOODVEXA RUMMY - Friends & Multiplayer";
            msgEl.textContent = "Multiplayer: நண்பர்களுடன் ஆன்லைனில் இணைவதற்கான அறை தயாராகிறது.";
            break;
        case 'tournament':
            titleEl.textContent = "GOODVEXA RUMMY - Tournaments";
            msgEl.textContent = "Tournaments: சிறப்புப் போட்டிகள் விரைவில் தொடங்குகின்றன.";
            break;
        case 'classic':
        default:
            titleEl.textContent = "GOODVEXA RUMMY - 13 Card Table";
            msgEl.textContent = "13 Card Rummy: விளையாட்டுத் தொடங்க START GAME அழுத்தவும்.";
            break;
    }
}

const suits = [
  {symbol:"♠", red:false},
  {symbol:"♥", red:true},
  {symbol:"♦", red:true},
  {symbol:"♣", red:false}
];

function createDeck() {
  let cards = [];
  for (const suit of suits) {
    for (let rank = 1; rank <= 13; rank++) {
      cards.push({ suit: suit.symbol, rank: rank, red: suit.red, joker: false });
    }
  }
  cards.push({ suit: "★", rank: 0, red: false, joker: true });
  cards.push({ suit: "★", rank: 0, red: true, joker: true });

  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function rankText(card) {
  if (card.joker) return "JK";
  if (card.rank === 1) return "A";
  if (card.rank === 11) return "J";
  if (card.rank === 12) return "Q";
  if (card.rank === 13) return "K";
  return String(card.rank);
}

function cardHTML(card, index, selectable) {
  const color = card.red ? "red" : "";
  const chosen = selectable && selected.includes(index);
  const label = card.joker ? "JOKER" : rankText(card);

  return `
    <div class="card ${color} ${chosen ? "selected" : ""}" onclick="${selectable ? `selectCard(${index})` : ""}">
      <small>${label}</small>
      <span style="font-size:18px; text-align:center;">${card.suit}</span>
      <small style="text-align:right;">${label}</small>
    </div>
  `;
}

function startGame() {
  deck = createDeck();
  hand = [];
  discardPile = [];
  selected = [];
  groups = [];
  mustDiscard = false;
  gameStarted = true;

  for (let i = 0; i < 13; i++) hand.push(deck.pop());
  discardPile.push(deck.pop());

  document.getElementById("botStatus").textContent = currentMode === 'practice' ? "AI Bot (Ready)" : "Opponent (Ready)";
  showMessage("விளையாட்டு தொடங்கியது! ஒரு கார்டை எடுக்கவும்.");
  render();
}

function render() {
  document.getElementById("hand").innerHTML = hand.map((card, index) => cardHTML(card, index, true)).join("");
  document.getElementById("deckCount").textContent = deck.length + " Left";

  const top = discardPile[discardPile.length - 1];
  document.getElementById("discardTop").innerHTML = top ? cardHTML(top, -1, false) : '<div class="card" style="opacity:0.3;">Empty</div>';

  document.getElementById("pileBtn").disabled = !gameStarted || mustDiscard || discardPile.length === 0;
  document.getElementById("discardBtn").disabled = !gameStarted || !mustDiscard || selected.length !== 1;

  document.getElementById("groupsDisplay").innerHTML = groups.map((group, gIndex) => {
    const cardsTxt = group.map(c => rankText(c) + c.suit).join(" ");
    return `
      <div class="group-pill">
        <span>G${gIndex + 1}: ${cardsTxt}</span>
        <span style="color:#ff5e62; cursor:pointer;" onclick="removeGroup(${gIndex})">✕</span>
      </div>
    `;
  }).join("");
}

function selectCard(index) {
  if (!gameStarted) return;
  if (selected.includes(index)) {
    selected = selected.filter(i => i !== index);
  } else {
    selected.push(index);
  }
  render();
}

function drawFromDeck() {
  if (!gameStarted || mustDiscard || deck.length === 0) return;
  hand.push(deck.pop());
  mustDiscard = true;
  selected = [];
  render();
  showMessage("கார்டு எடுத்தாச்சு! ஒரு தேவையற்ற கார்டை வெளியேற்றவும் (DISCARD).");
}

function drawFromDiscard() {
  if (!gameStarted || mustDiscard || discardPile.length === 0) return;
  hand.push(discardPile.pop());
  mustDiscard = true;
  selected = [];
  render();
  showMessage("Open Pile-ல் இருந்து கார்டு எடுத்தாச்சு! ஒரு கார்டை வெளியேற்றவும்.");
}

function discardSelected() {
  if (!mustDiscard || selected.length !== 1) return;
  const card = hand.splice(selected[0], 1)[0];
  discardPile.push(card);
  selected = [];
  mustDiscard = false;
  render();
  showMessage("அட்டை வெளியேற்றப்பட்டது. எதிராளியின் திருப்பம்...");

  setTimeout(aiTurn, 1200);
}

function aiTurn() {
  if (!gameStarted) return;
  document.getElementById("botStatus").textContent = "AI Playing...";
  setTimeout(() => {
    if (deck.length > 0) discardPile.push(deck.pop());
    document.getElementById("botStatus").textContent = "Your Turn!";
    showMessage("எதிராளி கார்டு விளையாடிவிட்டார். உங்கள் திருப்பம்!");
    render();
  }, 1000);
}

function sortHand() {
  if (!gameStarted) return;
  const suitOrder = { "♠": 1, "♥": 2, "♦": 3, "♣": 4 };
  hand.sort((a, b) => {
    if (a.joker) return 1;
    if (b.joker) return -1;
    return (suitOrder[a.suit] - suitOrder[b.suit]) || (a.rank - b.rank);
  });
  selected = [];
  render();
  showMessage("அட்டைகள் வரிசைப்படுத்தப்பட்டன (Sorted).");
}

// ஒரு Group செல்லுபடியாகும் Sequence அல்லது Set ஆக உள்ளதா?
function getGroupType(cards) {
  if (!Array.isArray(cards) || cards.length < 3 || cards.length > 13) {
    return null;
  }

  const jokers = cards.filter(c => c.joker);
  const natural = cards.filter(c => !c.joker);

  // SEQUENCE CHECK
  if (natural.length > 0) {
    const suits = new Set(natural.map(c => c.suit));

    if (suits.size === 1) {
      for (let start = 1; start <= 14 - cards.length + 1; start++) {
        const needed = [];

        for (let r = start; r < start + cards.length; r++) {
          needed.push(r);
        }

        const ranks = natural.map(c =>
          c.rank === 1 && start >= 12 ? 14 : c.rank
        );

        if (new Set(ranks).size !== ranks.length) continue;

        if (ranks.every(r => needed.includes(r))) {
          const missing = needed.filter(r => !ranks.includes(r)).length;

          if (missing === jokers.length) {
            return jokers.length === 0 ? "pure" : "impure";
          }
        }
      }
    }
  }

  // SET CHECK
  if (natural.length > 0 && natural.length <= 4) {
    const ranks = new Set(natural.map(c => c.rank));
    const suits = new Set(natural.map(c => c.suit));

    if (
      ranks.size === 1 &&
      suits.size === natural.length &&
      natural.length + jokers.length <= 4
    ) {
      return "set";
    }
  }

  return null;
}

// GROUP CREATE
function createGroup() {
  if (!gameStarted || selected.length < 3) {
    showMessage("Group உருவாக்க குறைந்தது 3 கார்டுகளைத் தேர்ந்தெடுக்கவும்.");
    return;
  }

  // ஏற்கனவே Group-ல் உள்ள கார்டுகளை மீண்டும் சேர்க்கக்கூடாது.
  const alreadyGrouped = groups.flat();

  if (selected.some(i => alreadyGrouped.includes(hand[i]))) {
    showMessage("இந்த கார்டு ஏற்கனவே Group-ல் உள்ளது!");
    return;
  }

  const groupCards = selected.map(i => hand[i]);
  const type = getGroupType(groupCards);

  if (!type) {
    showMessage("தவறான Group! Sequence அல்லது Set அமைக்கவும்.");
    return;
  }

  groups.push(groupCards);
  selected = [];

  render();

  if (type === "pure") {
    showMessage("✅ Pure Sequence உருவாக்கப்பட்டது!");
  } else if (type === "impure") {
    showMessage("✅ Impure Sequence உருவாக்கப்பட்டது!");
  } else {
    showMessage("✅ Valid Set உருவாக்கப்பட்டது!");
  }
}

// REMOVE GROUP
function removeGroup(index) {
  groups.splice(index, 1);
  render();
}

// முழு கையையும் சரிபார்க்கும் Rummy Validation
function validateRummy(cards) {

  if (cards.length !== 13) {
    return {
      valid: false,
      reason: "சரியாக 13 கார்டுகள் இருக்க வேண்டும்."
    };
  }

  const memo = new Map();

  function search(remaining, sequenceCount, hasPure) {

    if (remaining.length === 0) {
      return sequenceCount >= 2 && hasPure;
    }

    const key =
      remaining.join(",") + "|" + sequenceCount + "|" + hasPure;

    if (memo.has(key)) return memo.get(key);

    // மீதமுள்ள முதல் கார்டு இடம்பெறும் Group-களைத் தேடுதல்.
    for (let mask = 1; mask < (1 << remaining.length); mask++) {

      if (!(mask & 1)) continue;

      const indexes = [];

      for (let bit = 0; bit < remaining.length; bit++) {
        if (mask & (1 << bit)) {
          indexes.push(bit);
        }
      }

      if (indexes.length < 3) continue;

      const group = indexes.map(i => cards[remaining[i]]);
      const type = getGroupType(group);

      if (!type) continue;

      const rest = remaining.filter((_, i) => !indexes.includes(i));

      const nextSequenceCount =
        sequenceCount +
        (type === "pure" || type === "impure" ? 1 : 0);

      const nextHasPure = hasPure || type === "pure";

      if (search(rest, nextSequenceCount, nextHasPure)) {
        memo.set(key, true);
        return true;
      }
    }

    memo.set(key, false);
    return false;
  }

  const valid = search(cards.map((_, i) => i), 0, false);

  if (!valid) {
    return {
      valid: false,
      reason:
        "குறைந்தது 2 Sequence தேவை. அதில் 1 Pure Sequence கட்டாயம். மீதமுள்ள கார்டுகளும் செல்லுபடியாகும் Group-களாக இருக்க வேண்டும்."
    };
  }

  return {
    valid: true,
    reason: "அனைத்து Rummy விதிகளும் பூர்த்தியாகியுள்ளன!"
  };
}

// DECLARE
function declareRummy() {

  if (!gameStarted) {
    showMessage("முதலில் START GAME அழுத்தவும்.");
    return;
  }

  if (mustDiscard || hand.length !== 13) {
    showMessage("உங்கள் திருப்பத்தை முடித்து 13 கார்டுகளுடன் Declare செய்யவும்.");
    return;
  }

  const result = validateRummy(hand);

  if (!result.valid) {
    showMessage("❌ Declare செல்லாது: " + result.reason);
    alert("INVALID DECLARE\n" + result.reason);
    return;
  }

  alert("🏆 VALID RUMMY DECLARE! வாழ்த்துகள்!");

  showMessage("🏆 " + result.reason);

  gameStarted = false;
  render();
}

function showMessage(msg) {
  document.getElementById("message").textContent = msg;
}

render();
</script>
