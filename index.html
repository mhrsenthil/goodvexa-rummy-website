<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodvexa Rummy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d2818;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #05140b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #16db65;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #16db65;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
        }

        .lang-btn {
            background-color: #2d6a4f;
            color: #fff;
            border: 1px solid #16db65;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn {
            background-color: #ffb703;
            color: #000;
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 50px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero-text h1 {
            font-size: 42px;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 18px;
            color: #b7e4c7;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .play-now-btn {
            background-color: #ffb703;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
        }

        .disclaimer {
            margin-top: 15px;
            font-size: 13px;
            color: #74c69d;
        }

        /* மொழி தேர்வு பாப்-அப் (Language Modal with Scroll) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: #1b4332;
            border: 2px solid #16db65;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #16db65;
        }

        .modal-card p {
            color: #d8f3dc;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .lang-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 50vh;
            padding-right: 5px;
        }

        .lang-option-btn {
            background-color: #2d6a4f;
            color: #ffffff;
            border: 1px solid #52b788;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-option-btn:hover {
            background-color: #16db65;
            color: #000;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">GOODVEXA RUMMY</div>
        <div class="nav-links">
            <a href="#" id="nav-home">Home</a>
            <a href="#" id="nav-game">Game</a>
            <a href="#" id="nav-leaderboard">Leaderboard</a>
            <button class="lang-btn" onclick="openLanguageModal()">🌐 <span id="current-lang-text">English</span></button>
            <button class="login-btn" id="nav-login">Login</button>
        </div>
    </header>

    <main>
        <div class="hero-text">
            <h1 id="hero-title">Ready to Play Rummy?</h1>
            <p id="hero-subtitle">Practice 13-card rummy for free. Sharpen your skills with virtual coins.</p>
            <button class="play-now-btn" id="hero-btn">Start Playing</button>
            <div class="disclaimer" id="hero-disclaimer">This is a free practice game. No real money involved (₹1,00,000 virtual coins included).</div>
        </div>
    </main>

    <!-- Language Selection Modal -->
    <div class="modal-overlay" id="langModal">
        <div class="modal-card">
            <h2>Select Language</h2>
            <p>Please select your preferred language to continue</p>
            <div class="lang-options">
                <button class="lang-option-btn" onclick="selectLanguage('ta')">தமிழ் (Tamil)</button>
                <button class="lang-option-btn" onclick="selectLanguage('en')">English</button>
                <button class="lang-option-btn" onclick="selectLanguage('hi')">हिंदी (Hindi)</button>
                <button class="lang-option-btn" onclick="selectLanguage('te')">తెలుగు (Telugu)</button>
                <button class="lang-option-btn" onclick="selectLanguage('ml')">മലയാളം (Malayalam)</button>
                <button class="lang-option-btn" onclick="selectLanguage('kn')">ಕನ್ನಡ (Kannada)</button>
                <button class="lang-option-btn" onclick="selectLanguage('mr')">मराठी (Marathi)</button>
                <button class="lang-option-btn" onclick="selectLanguage('bn')">বাংলা (Bengali)</button>
                <button class="lang-option-btn" onclick="selectLanguage('gu')">ગુજરાતી (Gujarati)</button>
                <button class="lang-option-btn" onclick="selectLanguage('pa')">ਪੰਜਾਬੀ (Punjabi)</button>
            </div>
        </div>
    </div>

        window.onload = function() {
            const savedLang = localStorage.getItem('goodvexa_lang');
            if (savedLang && translations[savedLang]) {
                applyLanguage(savedLang);
                document.getElementById('langModal').classList.add('hidden');
            } else {
                document.getElementById('langModal').classList.remove('hidden');
            }
        };

        function selectLanguage(langCode) {
            localStorage.setItem('goodvexa_lang', langCode);
            applyLanguage(langCode);
            document.getElementById('langModal').classList.add('hidden');
        }

        function openLanguageModal() {
            document.getElementById('langModal').classList.remove('hidden');
        }

        function applyLanguage(lang) {
            const data = translations[lang] || translations.en;
            
            document.getElementById('current-lang-text').innerText = data.currentLangLabel;
            document.getElementById('nav-home').innerText = data.navHome;
            document.getElementById('nav-game').innerText = data.navGame;
            document.getElementById('nav-leaderboard').innerText = data.navLeaderboard;
            document.getElementById('nav-login').innerText = data.navLogin;
            document.getElementById('hero-title').innerText = data.heroTitle;
            document.getElementById('hero-subtitle').innerText = data.heroSubtitle;
            document.getElementById('hero-btn').innerText = data.heroBtn;
            document.getElementById('hero-disclaimer').innerText = data.heroDisclaimer;
            
            document.documentElement.lang = lang;
        }

</body>
</html>
